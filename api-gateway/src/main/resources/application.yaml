spring:
  application:
    name: api-gateway

  security:
    oauth2:
      resourceserver:
        jwt:
          public-key-location: file:${JWT_PUBLIC_KEY_PATH}

  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: auth-refresh
              uri: lb://AUTH-SERVICE
              predicates:
                - Path=/api/refresh
                - Method=POST
              filters:
                - RewritePath=/api/refresh, /api/auth/refresh

            - id: auth-oauth2-start
              uri: lb://AUTH-SERVICE
              predicates:
                - Path=/oauth2/authorization/**

            - id: auth-oauth2-callback
              uri: lb://AUTH-SERVICE
              predicates:
                - Path=/login/oauth2/code/**

            - id: auth-logout
              uri: lb://AUTH-SERVICE
              predicates:
                - Path=/api/logout
                - Method=POST
              filters:
                 - RewritePath=/api/logout, /api/auth/logout
server:
  port: 8080

eureka:
  client:
    service-url:
      defaultZone:  ${EUREKA_URL}

logging:
  level:
    org.springframework.security: INFO
    org.springframework.cloud.gateway: INFO