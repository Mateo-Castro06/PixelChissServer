services:

  api-gateway:
    image: pixelchiss-gateway:latest
    build:
      context: ../../api-gateway
    container_name: pixelchiss-gateway
    restart: unless-stopped

    environment:
      EUREKA_URL: ${EUREKA_URL}
      JWT_PUBLIC_KEY_PATH: ${JWT_PUBLIC_KEY_PATH}

    ports:
      - "8080:8080"

    volumes:
      - ../../api-gateway/keys:/app/keys:ro

    depends_on:
      - eureka-server

    networks:
      - pixelchiss-network

    healthcheck:
      test: [ "CMD", "curl", "--fail", "--silent", "http://localhost:8080/actuator/health" ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 60s

  eureka-server:
    image: pixelchiss-eureka:latest
    build:
      context: ../../eureka-server
    container_name: pixelchiss-eureka
    restart: unless-stopped
    ports:
      - "8761:8761"
    networks:
      - pixelchiss-network

  auth-service:
    image: pixelchiss-auth:latest
    build:
      context: ../../auth-service
    container_name: pixelchiss-auth
    restart: unless-stopped
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${POSTGRES_PASSWORD}

      EUREKA_URL: ${EUREKA_URL}

      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}

      JWT_PRIVATE_KEY_PATH: ${JWT_PRIVATE_KEY_PATH}
      JWT_PUBLIC_KEY_PATH: ${JWT_PUBLIC_KEY_PATH}

      LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_SECURITY: INFO

    ports:
      - "8081:8081"

    volumes:
      - ../../auth-service/keys:/app/keys:ro

    depends_on:
      - eureka-server
      - postgres

    networks:
      - pixelchiss-network

    healthcheck:
      test: [ "CMD", "curl", "--fail", "--silent", "http://localhost:8081/actuator/health" ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 60s

  game-service:
    image: pixelchiss-game:latest
    build:
      context: ../../game-service
    container_name: pixelchiss-game
    restart: unless-stopped
    environment:
      EUREKA_URL: ${EUREKA_URL}
      JWT_PUBLIC_KEY_PATH: ${JWT_PUBLIC_KEY_PATH}
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongodb:27017/pixelchiss}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      GAME_LOBBY_TOKEN: ${GAME_LOBBY_TOKEN:?Set a private Lobby-to-Game token of at least 32 characters}
      GAME_ALLOWED_ORIGINS: ${GAME_ALLOWED_ORIGINS:-http://localhost:8080}

    expose:
      - "8084"

    volumes:
      - ../../auth-service/keys/public_key.pem:${JWT_PUBLIC_KEY_PATH}:ro

    depends_on:
      eureka-server:
        condition: service_started
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy

    networks:
      - pixelchiss-network

    healthcheck:
      test: [ "CMD", "curl", "--fail", "--silent", "http://localhost:8084/actuator/health" ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 60s

  lobby-service:
    image: pixelchiss-lobby:latest
    build:
      context: ../../lobby-service
    container_name: pixelchiss-lobby
    restart: unless-stopped
    environment:
      EUREKA_URL: ${EUREKA_URL}
      JWT_PUBLIC_KEY_PATH: ${JWT_PUBLIC_KEY_PATH}
      REDIS_URL: ${LOBBY_REDIS_URL:-redis://redis:6379/1}
      SERVICE_HOST: lobby-service
      SERVICE_PORT: 8083
      GAME_LOBBY_TOKEN: ${GAME_LOBBY_TOKEN:?Set a private Lobby-to-Game token of at least 32 characters}
    ports:
      - "8083:8083"
    volumes:
      - ../../auth-service/keys/public_key.pem:${JWT_PUBLIC_KEY_PATH}:ro
    depends_on:
      eureka-server:
        condition: service_started
      redis:
        condition: service_healthy
    networks:
      - pixelchiss-network
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if b'UP' in urllib.request.urlopen('http://localhost:8083/health/redis').read() else 1)" ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  postgres:
    image: postgres:17
    container_name: pixelchiss-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - pixelchiss-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  mongodb:
    image: mongo:7
    container_name: pixelchiss-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: pixelchiss
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - pixelchiss-network
    healthcheck:
      test: [ "CMD", "mongosh", "--eval", "db.adminCommand('ping')" ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8
    container_name: pixelchiss-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - pixelchiss-network
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  mongodb_data:
  redis_data:

networks:
  pixelchiss-network:
    driver: bridge
