spring:
  application:
    name: game-service
  task:
    scheduling:
      pool:
        size: 4
  mongodb:
    uri: ${MONGODB_URI}
  security:
    oauth2:
      resourceserver:
        jwt:
          public-key-location: file:${JWT_PUBLIC_KEY_PATH}

  data:
    redis:
      url: ${REDIS_URL}

server:
  port: 8084

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL}

game:
  # Polling cadence is independent of the per-game visual budget.
  bot-step-millis: 500
  bot-pacing:
    roll-ms: 2100
    move-ms: 1300
    crown-ms: 1300
    trivia-ms: 1500
    end-turn-ms: 500
    other-ms: 800
  turn-millis: ${GAME_TURN_MILLIS:30000}
  animation-wait-millis: ${GAME_ANIMATION_WAIT_MILLIS:10000}
  trivia-millis: ${GAME_TRIVIA_MILLIS:15000}
  card-millis: ${GAME_CARD_MILLIS:15000}
  disconnect-grace-millis: ${GAME_DISCONNECT_GRACE_MILLIS:60000}
  lobby-token: ${GAME_LOBBY_TOKEN:}
  allowed-origins: ${GAME_ALLOWED_ORIGINS:http://localhost:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
