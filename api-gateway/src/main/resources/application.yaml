spring:
  application:
    name: api-gateway

  security:
    oauth2:
      resourceserver:
        jwt:
          public-key-location: file:${JWT_PUBLIC_KEY_PATH}

  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: auth-refresh
              uri: lb://AUTH-SERVICE
              predicates:
                - Path=/api/refresh
                - Method=POST
              filters:
                - RewritePath=/api/refresh, /api/auth/refresh

            - id: auth-oauth2-start
              uri: lb://AUTH-SERVICE
              predicates:
                - Path=/oauth2/authorization/**

            - id: auth-oauth2-callback
              uri: lb://AUTH-SERVICE
              predicates:
                - Path=/login/oauth2/code/**

            - id: auth-logout
              uri: lb://AUTH-SERVICE
              predicates:
                - Path=/api/logout
                - Method=POST
              filters:
                 - RewritePath=/api/logout, /api/auth/logout
            - id: auth-profile
              uri: lb://AUTH-SERVICE
              predicates:
                - Path=/api/auth/me
                - Method=GET

            - id: auth-update-display-name
              uri: lb://AUTH-SERVICE
              predicates:
                - Path=/api/auth/me/display-name
                - Method=PUT
            - id: game-board
              uri: lb://GAME-SERVICE
              predicates:
                - Path=/api/game/board
                - Method=GET
            - id: game-state
              uri: lb://GAME-SERVICE
              predicates:
                - Path=/api/game/games/{gameId}
                - Method=GET
            - id: game-diagnostics
              uri: lb://GAME-SERVICE
              predicates:
                - Path=/api/game/test/mongodb,/api/game/test/redis
                - Method=GET
              filters:
                - RewritePath=/api/game/test/(?<name>mongodb|redis), /test/${name}
            - id: game-openapi
              uri: lb://GAME-SERVICE
              predicates:
                - Path=/api/game/openapi
                - Method=GET
              filters:
                - RewritePath=/api/game/openapi, /v3/api-docs/public-game
            - id: game-swagger-index
              uri: forward:/game-swagger.html
              predicates:
                - Path=/api/game/swagger-ui/index.html
                - Method=GET
            - id: game-swagger-assets
              uri: lb://GAME-SERVICE
              predicates:
                - Path=/api/game/swagger-ui/**
                - Method=GET
              filters:
                - RewritePath=/api/game/swagger-ui/(?<asset>.*), /swagger-ui/${asset}
            - id: lobby-api
              uri: lb://LOBBY-SERVICE
              predicates:
                - Path=/api/lobbies/**
server:
  port: 8080

eureka:
  client:
    service-url:
      defaultZone:  ${EUREKA_URL}

logging:
  level:
    org.springframework.security: INFO
    org.springframework.cloud.gateway: INFO
